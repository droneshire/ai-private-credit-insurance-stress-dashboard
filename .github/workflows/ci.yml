name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Validate notebook
        run: uv run python scripts/validate_notebook.py
      - name: Type check
        run: uv run mypy scripts
      - name: Fetch SEC BDC NAV when SEC identity is configured
        if: ${{ vars.SEC_USER_AGENT != '' }}
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/fetch_bdc_sec.py
      - name: Execute stress dashboard against live FRED data
        run: uv run jupyter nbconvert --to notebook --execute ai_private_credit_insurance_stress_dashboard.ipynb --output executed.ipynb --ExecutePreprocessor.timeout=240
      - name: Upload dashboard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-dashboard-results
          path: |
            executed.ipynb
            stress_dashboard_data/*.csv
          if-no-files-found: warn
