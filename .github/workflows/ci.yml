name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly refresh so the GPU price history keeps accumulating.
    - cron: "17 13 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group dev --locked
      - name: Validate notebook
        run: uv run python scripts/validate_notebook.py
      - name: Type check
        run: uv run mypy scripts
      - name: Unit tests
        run: uv run pytest -q
      - name: Restore GPU price history from the last successful main run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name stress-dashboard-results --dir previous
            mkdir -p stress_dashboard_data
            cp previous/stress_dashboard_data/gpu_price_history.csv stress_dashboard_data/ || true
          fi
      - name: Fetch SEC BDC metrics when SEC identity is configured
        if: ${{ vars.SEC_USER_AGENT != '' }}
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/fetch_bdc_sec.py
      - name: Fetch SEC insurer balance sheets when SEC identity is configured
        if: ${{ vars.SEC_USER_AGENT != '' }}
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/fetch_insurers_sec.py
      - name: Fetch compute economics when SEC identity is configured
        if: ${{ vars.SEC_USER_AGENT != '' }}
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/fetch_compute.py
      - name: Execute stress dashboard against live data
        run: uv run jupyter nbconvert --to notebook --execute ai_private_credit_insurance_stress_dashboard.ipynb --output executed.ipynb --ExecutePreprocessor.timeout=300
      - name: Render HTML report
        run: uv run jupyter nbconvert --to html executed.ipynb --output stress_dashboard_report.html
      - name: Upload dashboard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-dashboard-results
          path: |
            executed.ipynb
            stress_dashboard_report.html
            stress_dashboard_data/*.csv
          if-no-files-found: warn

  publish:
    # Publishes the report to GitHub Pages: the latest at the site root, dated
    # copies kept for 14 days. Only main runs publish.
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SEC_USER_AGENT != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stress-dashboard-results
          path: results
      - name: Check out the currently published site
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git worktree add --detach previous FETCH_HEAD
          fi
      - name: Build site
        run: |
          previous=()
          [ -d previous ] && previous=(--previous previous)
          python3 scripts/build_site.py results/stress_dashboard_report.html site "${previous[@]}" --retention-days 14
      - name: Publish as a single commit so expired reports leave no history
        run: |
          git -C site init -q -b gh-pages
          git -C site add -A
          git -C site -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish stress dashboard report"
          git fetch -q site gh-pages
          git push --force origin FETCH_HEAD:refs/heads/gh-pages
